# Application Name
spring.application.name=HydroSense

# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hydrosense_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=HydroSenseSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024
jwt.expiration=86400000

# ESP32 API Key
esp32.api.key=ESP32_HYDROSENSE_SECRET_KEY_2024

# Water Quality Thresholds
water.threshold.temperature.min=0
water.threshold.temperature.max=35
water.threshold.ph.min=6.5
water.threshold.ph.max=8.5
water.threshold.tds.min=0
water.threshold.tds.max=500
water.threshold.turbidity.min=0
water.threshold.turbidity.max=5
water.threshold.dissolved-oxygen.min=5
water.threshold.dissolved-oxygen.max=14

# Approaching Unsafe Threshold (percentage)
water.threshold.warning-percentage=10

# Data Retention (days)
data.retention.days=5

# Scheduler Configuration
spring.task.scheduling.pool.size=5

# Email Configuration (Update with your SMTP credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kamthemayur35@gmail.com
spring.mail.password=almk zytt pxng kwjh
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.smartwater.HydroSense=DEBUG
logging.level.org.springframework.security=DEBUG

# Super Admin Credentials (auto-seeded on startup)
superadmin.email=superadmin@hydrosense.com
superadmin.password=SuperAdmin@2024
superadmin.fullname=Super Admin
